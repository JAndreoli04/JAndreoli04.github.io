<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Jack Game</title>
    <script src="js/script.js" defer></script>
    <script src="https://unpkg.com/underscore@1.13.7/underscore-umd-min.js">
    </script>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div>
        <h1>Black Jack Game</h1>
        <p id="gamecount">Wins: 0 | Ties: 0 | Losses: 0 </p>
    </div>
    <div id="gameDiv">
        <div id="dealerHand">
            <p id="dealerOutput"></p>
            <p id="dealerTotal"></p>
        </div>
        <br>
        <div id="userHand">
            <p id="userCards"></p>
            <p id="userTotal"></p>
        </div>
        <p id="results"></p>
    </div>
    <div id="gameControls">
        <button id="hitBtn">Hit</button>
        <button id="standBtn">Stand</button>
        <button id="restartBtn">Restart</button>
    </div>

    
</body>
</html>
